<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mijn schoolgerief">
<title>Mijn schoolgerief — Quiz</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f3f6fb;color:#14264a;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
main{max-width:700px;margin:auto;padding:12px 12px 36px}
.header{background:linear-gradient(135deg,#146ed3,#2c83eb);color:#fff;border-radius:22px;padding:18px 16px;text-align:center}
h1{font-size:28px;margin:0 0 5px}.sub{font-size:15px}
.stats{display:flex;gap:8px;margin:12px 0}.pill{flex:1;background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 3px 12px #dbe2ee;font-weight:800}
.progress{height:9px;background:#dfe5ee;border-radius:9px;overflow:hidden;margin:10px 0 15px}.bar{height:100%;background:#25a66a;width:0%;transition:.25s}
.card{background:#fff;border-radius:22px;padding:15px;box-shadow:0 5px 20px rgba(20,30,60,.09)}
.photo{height:275px;border:2px solid #e0e6ef;border-radius:17px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain}
.q{font-weight:800;color:#3157b7;margin:2px 0 10px}
label{display:block;font-weight:800;font-size:17px;margin:15px 0 7px}
input{width:100%;height:56px;border:2px solid #d5dce7;border-radius:15px;font-size:20px;padding:0 14px;-webkit-appearance:none}
input:focus{outline:none;border-color:#2878df}
.actions{display:flex;gap:9px;margin-top:10px}button{min-height:50px;border:0;border-radius:14px;font-size:16px;font-weight:800;padding:10px 13px;cursor:pointer}
.primary{background:#20a765;color:#fff;flex:1}.hint{background:#e7f0ff;color:#174a9e;flex:1}.next{background:#2878df;color:#fff;flex:1}
button:disabled{opacity:.45;cursor:default}
.feedback{min-height:48px;text-align:center;padding:12px 3px;font-weight:800;font-size:17px}
.good{color:#13834b}.bad{color:#c83d4b}
.result{text-align:center;padding:22px 12px}.big{font-size:52px;font-weight:900;margin:8px}
.meter{height:13px;background:#e4e8ef;border-radius:20px;overflow:hidden;margin:15px 0}.meter>div{height:100%;background:#20a765}
.review{text-align:left;background:#f6f8fb;border-radius:15px;padding:12px;margin-top:14px}
.review li{margin:6px 0}.small{font-size:13px;color:#667085;text-align:center;margin-top:12px;line-height:1.4}
.hidden{display:none}
@media(max-width:430px){main{padding:9px}h1{font-size:25px}.photo{height:245px}.actions{flex-direction:column}button{width:100%}}
@media(prefers-reduced-motion:reduce){.bar{transition:none}}
</style>
</head>
<body>
<main>
<section class="header">
  <h1>📚 Mijn schoolgerief</h1>
  <div class="sub">Schrijf het juiste Nederlandse woord bij de afbeelding.</div>
</section>

<section class="stats">
  <div class="pill" id="question">Vraag 1 / 32</div>
  <div class="pill" id="score">⭐ 0 punten</div>
</section>
<div class="progress" aria-label="Voortgang"><div class="bar" id="bar"></div></div>

<section class="card" id="quiz">
  <div class="q" id="qtext">Vraag 1 van 32</div>
  <div class="photo"><img id="picture" alt="Schoolvoorwerp"></div>
  <label for="answer">Jouw antwoord</label>
  <input id="answer" type="text" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="Typ het Nederlandse woord…">
  <div class="actions">
    <button class="primary" id="check" type="button">✓ Controleren</button>
    <button class="hint" id="show" type="button">💡 Toon de oplossing</button>
  </div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <button class="next hidden" id="next" type="button">Volgende vraag →</button>
  <div class="small">⭐ 1 punt par bonne réponse au premier essai. Les différentes formulations possibles sont acceptées.</div>
</section>

<section class="card result hidden" id="result" aria-live="polite"></section>
</main>

const $=id=>document.getElementById(id);
let deck=[],i=0,points=0,answered=false,wrong=[];

function norm(s){
 return String(s||"").toLowerCase().trim().replace(/[.,!?]/g,"").replace(/\s+/g," ");
}
function shuffle(a){
 const b=a.slice(); for(let j=b.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[b[j],b[k]]=[b[k],b[j]];} return b;
}
function update(){
 $("question").textContent=`Vraag ${i+1} / ${deck.length}`;
 $("score").textContent=`⭐ ${points} ${points===1?"punt":"punten"}`;
 $("bar").style.width=`${Math.round(i/deck.length*100)}%`;
}
function showCard(){
 answered=false; const c=deck[i];
 $("picture").src=c.img; $("answer").value=""; $("answer").disabled=false;
 $("feedback").textContent=""; $("next").classList.add("hidden");
 $("check").disabled=false; $("show").disabled=false; update();
 setTimeout(()=> $("answer").focus(),40);
}
function finish(){
 $("quiz").classList.add("hidden"); $("result").classList.remove("hidden"); $("bar").style.width="100%";
 const pct=Math.round(points/deck.length*100);
 let title=pct>=90?"🏆 Fantastisch!":pct>=75?"🎉 Heel goed!":pct>=50?"👏 Goed bezig!":"💪 Nog even oefenen!";
 let list=wrong.length?`<div class="review"><b>Woorden om nog eens te oefenen:</b><ul>${wrong.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:"<p>Alle antwoorden waren juist. Super!</p>";
 $("result").innerHTML=`<h2>${title}</h2><div class="big">${points} / 32</div><p>${pct}% correct du premier coup</p><div class="meter"><div style="width:${pct}%"></div></div>${list}<button class="next" id="restart" type="button">🔄 Opnieuw spelen</button>`;
 $("restart").addEventListener("click",restart);
}
function check(reveal){
 if(answered)return; answered=true; const c=deck[i]; const val=norm($("answer").value);
 const ok=!reveal && c.accepted.some(x=>norm(x)===val);
 if(ok){points++; $("feedback").innerHTML='<span class="good">✅ Juist! +1 punt</span>';}
 else {
   const answer=c.accepted.join(" / ");
   if(!wrong.includes(answer)) wrong.push(answer);
   $("feedback").innerHTML='<span class="bad">'+(reveal?"💡 Oplossing: ":"❌ Niet juist. Oplossing: ")+answer+'</span>';
 }
 $("answer").disabled=true; $("check").disabled=true; $("show").disabled=true; $("next").classList.remove("hidden"); update();
}
function restart(){deck=shuffle(cards);i=0;points=0;wrong=[];$("quiz").classList.remove("hidden");$("result").classList.add("hidden");showCard();}
$("check").addEventListener("click",()=>check(false));
$("show").addEventListener("click",()=>check(true));
$("next").addEventListener("click",()=>{i++; if(i>=deck.length)finish(); else showCard();});
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")check(false);});
restart();
})();
</script>
